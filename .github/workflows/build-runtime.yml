name: Build RingOut Runtime (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-runtime.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: jackpoison-prog/RingOut
          ref: main

      - name: Patch NumericSetting.h for MSVC C2248
        shell: pwsh
        run: |
          $f = 'ModernGekko\vendor\dolphin\Source\Core\InputCommon\ControllerEmu\Setting\NumericSetting.h'
          $s = Get-Content -Raw -LiteralPath $f
          if ($s -match "class SettingValue\r?\n\{\r?\n  using ValueType = T;") {
            $s = $s -replace "class SettingValue(\r?\n)\{\1  using ValueType = T;", "class SettingValue`${1}{`${1}public:`${1}  using ValueType = T;"
            [System.IO.File]::WriteAllText($f, $s)
            Write-Host 'Patched'
          }

      - name: Configure (with MSVC conformance flags)
        run: >
          cmake -S ModernGekko -B build -G "Visual Studio 17 2022" -A x64
          -DENABLE_QT=OFF -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF
          -DENABLE_AUTOUPDATE=OFF
          -DCMAKE_CXX_FLAGS="/Zc:preprocessor /permissive"

      - name: Build runtime
        run: cmake --build build --config Release --target moderngekko-run
      - name: Build recompiler
        run: cmake --build build --config Release --target dolrecomp

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Get-ChildItem -Path build -Recurse -Include moderngekko-run.exe,dolrecomp.exe |
            ForEach-Object { Copy-Item $_.FullName staging/ }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ringout-windows-binaries
          path: staging/
      - name: Publish to release
        shell: bash
        run: |
          7z a -tzip RingOut-windows-binaries.zip ./staging/* > /dev/null
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --prerelease --title "Windows binaries (rolling)"
          gh release upload windows-latest RingOut-windows-binaries.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
